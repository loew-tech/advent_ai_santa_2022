[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advent-ai-santa-2022"
version = "0.1.0"
description = "Advent of Code 2022 solutions for Days 1–3"
requires-python = ">=3.12"
dependencies = ["santas-bag==1.0.0"]

[project.scripts]
aoc-2022 = "advent_ai_santa_2022.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
